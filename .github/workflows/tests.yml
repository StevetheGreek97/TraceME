name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libglib2.0-0 libdbus-1-3
      - name: Install dependencies
        run: pip install PyQt6 numpy pyyaml opencv-python-headless pytest
      - name: Run tests
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
